{{define "create"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Post</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">

    <style>
        :root {
            --paper: #f2ece0;
            --card: #fffbf4;
            --ink: #201f1b;
            --ink-soft: #6b6459;
            --pine: #33513f;
            --pine-deep: #233a2c;
            --rust: #b1502e;
            --line: #ddd1b6;
            --hole: #d8cba9;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --paper: #16150f;
                --card: #201e18;
                --ink: #eee7d8;
                --ink-soft: #a89d87;
                --pine: #83a891;
                --pine-deep: #a3c7ac;
                --rust: #cf7452;
                --line: #34301f;
                --hole: #16150f;
            }
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--paper);
            color: var(--ink);
            font-family: 'Inter', Arial, sans-serif;
        }

        a { color: inherit; }

        :focus-visible {
            outline: 2px solid var(--pine);
            outline-offset: 3px;
        }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; }
        }

        .wrap { max-width: 1120px; margin: 0 auto; padding: 0 6%; }

        /* ------------------------------
           Nav
        ------------------------------ */

        nav.wrap {
            padding-top: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Fraunces', serif;
            font-weight: 600;
            font-size: 20px;
            letter-spacing: -0.3px;
            text-decoration: none;
        }

        .logo b { color: var(--rust); font-weight: 600; }

        .nav-links { display: flex; gap: 6px; align-items: center; }

        .nav-links a {
            text-decoration: none;
            color: var(--ink);
            font-size: 14px;
            font-weight: 500;
            padding: 8px 14px;
        }

        .nav-links a.current { color: var(--rust); }

        /* ------------------------------
           Page head
        ------------------------------ */

        .page-head { max-width: 640px; margin: 0 auto; padding: 46px 6% 8px; }

        .kicker {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
            letter-spacing: 1.6px;
            text-transform: uppercase;
            color: var(--rust);
            margin: 0 0 10px;
        }

        .kicker::before { content: "— "; }

        .page-head h1 {
            font-family: 'Fraunces', serif;
            font-weight: 600;
            font-size: clamp(28px, 4vw, 38px);
            letter-spacing: -0.6px;
            margin: 0;
        }

        /* ------------------------------
           Form card
        ------------------------------ */

        .sheet {
            max-width: 640px;
            margin: 26px auto 100px;
            padding: 0 6%;
        }

        form {
            position: relative;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 36px 36px 32px;
        }

        .holes { display: flex; gap: 8px; margin-bottom: 22px; }
        .holes span {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--hole);
            border: 1px solid var(--line);
        }

        .field { margin-bottom: 24px; }

        .field label {
            display: block;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11.5px;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--ink-soft);
            margin-bottom: 9px;
        }

        .field input[type="text"],
        .field textarea {
            width: 100%;
            border: none;
            border-bottom: 1px solid var(--line);
            background: transparent;
            font-family: 'Source Serif 4', serif;
            font-size: 17px;
            color: var(--ink);
            padding: 6px 2px 10px;
            outline: none;
            transition: border-color .15s ease;
        }

        .field input[type="text"]:focus,
        .field textarea:focus {
            border-color: var(--pine);
        }

        .field input::placeholder,
        .field textarea::placeholder {
            color: var(--ink-soft);
            opacity: .7;
        }

        .field textarea {
            min-height: 220px;
            resize: vertical;
            line-height: 1.8;
            border: 1px solid var(--line);
            border-radius: 4px;
            padding: 14px 16px;
            background-image: repeating-linear-gradient(
                    to bottom,
                    transparent,
                    transparent 31px,
                    var(--line) 32px
            );
        }

        .field input[type="file"] {
            font-family: 'Inter', Arial, sans-serif;
            font-size: 13.5px;
            color: var(--ink-soft);
        }

        .checkbox-field {
            display: flex;
            align-items: center;
            gap: 9px;
            margin-bottom: 22px;
            font-size: 14.5px;
            color: var(--ink);
        }

        .checkbox-field input { accent-color: var(--pine); width: 16px; height: 16px; }

        #share-field {
            overflow: hidden;
            max-height: 0;
            opacity: 0;
            transition: max-height .2s ease, opacity .2s ease, margin .2s ease;
            margin-bottom: 0;
        }

        #share-field.open {
            max-height: 120px;
            opacity: 1;
            margin-bottom: 24px;
        }

        #share-field .hint {
            font-family: 'Inter', Arial, sans-serif;
            font-size: 12.5px;
            color: var(--ink-soft);
            margin-top: 6px;
        }

        button[type="submit"] {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 6px;
            background: var(--rust);
            color: #fdf5ee;
            font-family: 'Inter', Arial, sans-serif;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background .15s ease, transform .15s ease;
        }

        button[type="submit"]:hover {
            background: #954024;
            transform: translateY(-1px);
        }

        /* ------------------------------
           Responsive
        ------------------------------ */

        @media (max-width: 480px) {
            .logo { font-size: 17px; }
            form { padding: 26px 22px 24px; }
        }
    </style>
</head>

<body>

<nav class="wrap">
    <a class="logo" href="/blog"><b>§</b> My Weblog</a>
    <div class="nav-links">
        <a href="/dashboard">Dashboard</a>
        <a href="/profile">Profile</a>
        <a href="/logout">Logout</a>
        <a href="/posts/new" class="current">New Post</a>
    </div>
</nav>

<div class="page-head">
    <p class="kicker">New entry</p>
    <h1>Write something down</h1>
</div>

<div class="sheet">
    <form action="/posts" method="POST" enctype="multipart/form-data">

        <div class="holes"><span></span><span></span></div>

        <div class="field">
            <label for="title">Title</label>
            <input id="title" type="text" name="title" placeholder="Give it a name" required>
        </div>

        <div class="field">
            <label for="content">Content</label>
            <textarea id="content" name="content" placeholder="Start writing…" required></textarea>
        </div>

        <div class="field">
            <label for="image">Image (optional)</label>
            <input id="image" type="file" name="image" accept="image/*">
        </div>

        <label class="checkbox-field">
            <input type="checkbox" name="is_private" id="is_private">
            Keep this post private
        </label>

        <div class="field" id="share-field">
            <label for="share_with">Share with usernames</label>
            <input id="share_with" type="text" name="share_with" placeholder="ali, sara, mahdi">
            <p class="hint">Comma-separated. Only people you list here can read a private post.</p>
        </div>

        <button type="submit">Create Post</button>

    </form>
</div>

<script>
    const privateCheckbox = document.getElementById('is_private');
    const shareField = document.getElementById('share-field');

    function syncShareField() {
        shareField.classList.toggle('open', privateCheckbox.checked);
    }

    privateCheckbox.addEventListener('change', syncShareField);
    syncShareField();
</script>

</body>
</html>
{{end}}
