{{define "shares"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Shares</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">

    <style>
        :root {
            --paper: #f2ece0;
            --card: #fffbf4;
            --ink: #201f1b;
            --ink-soft: #6b6459;
            --pine: #33513f;
            --pine-deep: #233a2c;
            --rust: #b1502e;
            --line: #ddd1b6;
            --hole: #d8cba9;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --paper: #16150f;
                --card: #201e18;
                --ink: #eee7d8;
                --ink-soft: #a89d87;
                --pine: #83a891;
                --pine-deep: #a3c7ac;
                --rust: #cf7452;
                --line: #34301f;
                --hole: #16150f;
            }
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--paper);
            color: var(--ink);
            font-family: 'Inter', Arial, sans-serif;
        }

        a { color: inherit; }

        :focus-visible {
            outline: 2px solid var(--pine);
            outline-offset: 3px;
        }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; }
        }

        .wrap { max-width: 1120px; margin: 0 auto; padding: 0 6%; }



        nav.wrap {
            padding-top: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Fraunces', serif;
            font-weight: 600;
            font-size: 20px;
            letter-spacing: -0.3px;
            text-decoration: none;
        }

        .logo b { color: var(--rust); font-weight: 600; }

        .nav-links { display: flex; gap: 6px; align-items: center; }

        .nav-links a {
            text-decoration: none;
            color: var(--ink);
            font-size: 14px;
            font-weight: 500;
            padding: 8px 14px;
        }

        .nav-links a.new {
            background: var(--pine);
            color: #faf6ea;
            border-radius: 5px;
        }

        .nav-links a.new:hover { background: var(--pine-deep); }



        .page-head { max-width: 560px; margin: 0 auto; padding: 46px 6% 8px; }

        .kicker {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
            letter-spacing: 1.6px;
            text-transform: uppercase;
            color: var(--rust);
            margin: 0 0 10px;
        }

        .kicker::before { content: "— "; }

        .page-head h1 {
            font-family: 'Fraunces', serif;
            font-weight: 600;
            font-size: clamp(26px, 4vw, 34px);
            letter-spacing: -0.6px;
            margin: 0 0 10px;
        }

        .page-head .sub {
            color: var(--ink-soft);
            font-size: 15px;
            margin: 0;
        }



        .sheet { max-width: 560px; margin: 26px auto 0; padding: 0 6%; }

        .card {
            position: relative;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 30px 32px 28px;
            margin-bottom: 22px;
        }

        .holes { display: flex; gap: 8px; margin-bottom: 18px; }
        .holes span {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--hole);
            border: 1px solid var(--line);
        }

        .card h2 {
            font-family: 'Fraunces', serif;
            font-weight: 600;
            font-size: 19px;
            margin: 0 0 18px;
        }



        .share-form {
            display: flex;
            gap: 10px;
        }

        .share-form input {
            flex: 1;
            border: none;
            border-bottom: 1px solid var(--line);
            background: transparent;
            font-family: 'Inter', Arial, sans-serif;
            font-size: 15px;
            color: var(--ink);
            padding: 8px 2px 10px;
            outline: none;
            transition: border-color .15s ease;
        }

        .share-form input:focus { border-color: var(--pine); }

        .share-form input::placeholder { color: var(--ink-soft); opacity: .7; }

        .share-form button {
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            background: var(--pine);
            color: #faf6ea;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: background .15s ease, transform .15s ease;
        }

        .share-form button:hover {
            background: var(--pine-deep);
            transform: translateY(-1px);
        }

        .message {
            margin-top: 14px;
            padding: 10px 14px;
            border-radius: 4px;
            display: none;
            font-size: 13.5px;
            font-family: 'IBM Plex Mono', monospace;
        }

        .message.success {
            display: block;
            background: rgba(61, 90, 69, 0.12);
            color: var(--pine-deep);
        }

        .message.error {
            display: block;
            background: rgba(177, 80, 46, 0.12);
            color: var(--rust);
        }



        .user {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 0;
            border-bottom: 1px dashed var(--line);
        }

        .user:last-child { border-bottom: none; }

        .username {
            font-weight: 500;
            font-size: 14.5px;
        }

        .remove {
            border: 1px solid var(--line);
            background: transparent;
            color: var(--ink);
            padding: 7px 13px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
            font-family: 'Inter', Arial, sans-serif;
            transition: border-color .15s ease, color .15s ease;
        }

        .remove:hover {
            border-color: var(--rust);
            color: var(--rust);
        }

        .empty {
            text-align: center;
            color: var(--ink-soft);
            padding: 16px 0;
            font-size: 14px;
        }

        .back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin: 4px 0 100px;
            text-decoration: none;
            color: var(--ink-soft);
            font-size: 14px;
            font-weight: 500;
        }

        .back:hover { color: var(--rust); }



        @media (max-width: 480px) {
            .logo { font-size: 17px; }
            .card { padding: 24px 22px 22px; }
            .share-form { flex-direction: column; }
            .share-form button { width: 100%; }
        }
    </style>
</head>

<body>

<nav class="wrap">
    <a class="logo" href="/blog"><b>§</b> My Weblog</a>
    <div class="nav-links">
        <a href="/dashboard">Dashboard</a>
        <a href="/profile">Profile</a>
        <a href="/logout">Logout</a>
        <a href="/posts/new" class="new">New Post</a>
    </div>
</nav>

<div class="page-head">
    <p class="kicker">Private post</p>
    <h1>Manage sharing</h1>
    <p class="sub">Manage users who can access this private post.</p>
</div>

<div class="sheet">

    <!-- Add User -->
    <div class="card">
        <div class="holes"><span></span><span></span></div>
        <h2>Share with user</h2>

        <form id="shareForm" class="share-form">
            <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter username"
                    required
            >
            <button type="submit">Share</button>
        </form>

        <div id="message" class="message"></div>
    </div>

    <!-- Shared Users -->
    <div class="card">
        <div class="holes"><span></span><span></span></div>
        <h2>Users with access</h2>

        <div id="users">
            <div class="empty">Loading...</div>
        </div>
    </div>

    <a class="back" href="/dashboard">← Back to Dashboard</a>

</div>

<script>
    const pathParts = window.location.pathname.split("/");
    const postId = pathParts[2];

    const usersContainer = document.getElementById("users");
    const shareForm = document.getElementById("shareForm");
    const usernameInput = document.getElementById("username");
    const message = document.getElementById("message");

    function showMessage(text, type) {
        message.textContent = text;
        message.className = "message " + type;
    }

    async function loadShares() {
        try {
            const response = await fetch("/posts/" + postId + "/shares");

            if (!response.ok) throw new Error("Failed to load shared users");

            const users = await response.json();
            usersContainer.innerHTML = "";

            if (!users || users.length === 0) {
                usersContainer.innerHTML =
                    `<div class="empty">This post has not been shared with anyone yet.</div>`;
                return;
            }

            users.forEach(user => {
                const div = document.createElement("div");
                div.className = "user";

                div.innerHTML = `
                    <span class="username">👤 ${escapeHtml(user.Username)}</span>
                    <button class="remove" onclick="removeShare(${user.ID})">Remove</button>
                `;

                usersContainer.appendChild(div);
            });

        } catch (error) {
            usersContainer.innerHTML =
                `<div class="empty">Failed to load shared users.</div>`;
        }
    }

    shareForm.addEventListener("submit", async function(event) {
        event.preventDefault();

        const username = usernameInput.value.trim();

        if (!username) {
            showMessage("Username is required.", "error");
            return;
        }

        try {
            const response = await fetch(
                "/posts/" + postId + "/share",
                {
                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body: "username=" + encodeURIComponent(username)
                }
            );

            const data = await response.json().catch(() => null);

            if (!response.ok) {
                showMessage(data?.message || "Failed to share post.", "error");
                return;
            }

            showMessage("Post shared successfully.", "success");
            usernameInput.value = "";
            loadShares();

        } catch (error) {
            showMessage("Something went wrong.", "error");
        }
    });

    async function removeShare(userId) {
        if (!confirm("Are you sure you want to remove this user's access?")) return;

        try {
            const response = await fetch(
                "/posts/" + postId + "/shares/" + userId,
                { method: "DELETE" }
            );

            const data = await response.json().catch(() => null);

            if (!response.ok) {
                showMessage(data?.message || "Failed to remove access.", "error");
                return;
            }

            showMessage("User access removed successfully.", "success");
            loadShares();

        } catch (error) {
            showMessage("Something went wrong.", "error");
        }
    }

    function escapeHtml(value) {
        const div = document.createElement("div");
        div.textContent = value;
        return div.innerHTML;
    }

    loadShares();
</script>

</body>
</html>
{{end}}
